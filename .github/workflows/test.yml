name: Test

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main, stage]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 24.x
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install
      - run: npm test
