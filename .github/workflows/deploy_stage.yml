name: Stage

on:
  push:
    branches: [stage]
  # Manual redeploy of `stage` (e.g. after changing a secret).
  workflow_dispatch:

# Never run two stage deploys at once; a queued run waits for the current one.
concurrency:
  group: deploy-stage
  cancel-in-progress: false

jobs:
  test:
    name: Test
    # Manual runs may only deploy the `stage` branch to stage.
    if: github.ref == 'refs/heads/stage'
    runs-on: ubuntu-latest
    steps:
      # Manual runs wait for any in-flight deploy (concurrency) and check out the
      # SHA captured when the run was requested. If the branch moved meanwhile
      # (e.g. a newer commit landed on stage), that SHA is stale:
      # deploying it would overwrite the newer deployment. Fail instead.
      - name: Reject stale manual run
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$GITHUB_REF_NAME" --jq .object.sha)
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo "::error::$GITHUB_REF_NAME moved to $head after this run was requested ($GITHUB_SHA). Re-run the workflow to deploy the latest commit."
            exit 1
          fi
      - uses: actions/checkout@v4
      - name: Use Node.js 24.x
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install
      - run: npm test

  deploy:
    name: Deploy to Stage
    # Pinned: aio-apps-action runs `sudo --preserve-env`, which the sudo-rs
    # shipped in ubuntu-latest (26.04) ignores, dropping the env (AIO_* vars).
    runs-on: ubuntu-24.04
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 24.x
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install
      - name: Setup CLI
        uses: adobe/aio-cli-setup-action@1.3.0
        with:
          os: ubuntu-latest
          version: 11.x.x
      - name: Auth
        uses: adobe/aio-apps-action@3.3.0
        with:
          os: ubuntu-latest
          command: oauth_sts
          CLIENTID: ${{ secrets.CLIENTID_STAGE }}
          CLIENTSECRET: ${{ secrets.CLIENTSECRET_STAGE }}
          TECHNICALACCOUNTID: ${{ secrets.TECHNICALACCID_STAGE }}
          TECHNICALACCOUNTEMAIL: ${{ secrets.TECHNICALACCEMAIL_STAGE }}
          IMSORGID: ${{ secrets.IMSORGID_STAGE }}
          SCOPES: ${{ secrets.SCOPES_STAGE }}
      - name: Build
        env:
          AIO_RUNTIME_NAMESPACE: ${{ secrets.AIO_RUNTIME_NAMESPACE_STAGE }}
        uses: adobe/aio-apps-action@3.3.0
        with:
          os: ubuntu-latest
          command: build
      - name: Deploy
        env:
          AIO_RUNTIME_NAMESPACE: ${{ secrets.AIO_RUNTIME_NAMESPACE_STAGE }}
          AIO_RUNTIME_AUTH: ${{ secrets.AIO_RUNTIME_AUTH_STAGE }}
          AIO_PROJECT_ID: ${{ secrets.AIO_PROJECT_ID_STAGE }}
          AIO_PROJECT_NAME: ${{ secrets.AIO_PROJECT_NAME_STAGE }}
          AIO_PROJECT_ORG_ID: ${{ secrets.AIO_PROJECT_ORG_ID_STAGE }}
          AIO_PROJECT_WORKSPACE_ID: ${{ secrets.AIO_PROJECT_WORKSPACE_ID_STAGE }}
          AIO_PROJECT_WORKSPACE_NAME: ${{ secrets.AIO_PROJECT_WORKSPACE_NAME_STAGE }}
          AIO_PROJECT_WORKSPACE_DETAILS_SERVICES: ${{ secrets.AIO_PROJECT_WORKSPACE_DETAILS_SERVICES_STAGE }}
          AIO_CLIENTID: ${{ secrets.CLIENTID_STAGE }}
          AIO_CLIENTSECRET: ${{ secrets.CLIENTSECRET_STAGE }}
          AIO_SCOPES: ${{ secrets.SCOPES_STAGE }}
          AIO_IMSORGID: ${{ secrets.IMSORGID_STAGE }}
          AIO_EVENTS_PROVIDER_ID: ${{ secrets.EVENTS_PROVIDER_ID_STAGE }}
          EMAIL_TOKEN: ${{ secrets.EMAIL_TOKEN_STAGE }}
          PROXY_TOKEN: ${{ secrets.PROXY_TOKEN }}
          EBS_BASE_URL: ${{ secrets.EBS_BASE_URL_STAGE }}
          EBS_BASE_URL_STAGE: ${{ secrets.EBS_BASE_URL_STAGE }}
          EBS_API_KEY: ${{ secrets.EBS_API_KEY_STAGE }}
          EBS_API_KEY_STAGE: ${{ secrets.EBS_API_KEY_STAGE }}
          SYNC_STATUS_TOKEN: ${{ secrets.SYNC_STATUS_TOKEN_STAGE }}
          EDGE_COMMERCE_API_ORDERS_TOKEN: ${{ secrets.EDGE_COMMERCE_API_ORDERS_TOKEN_STAGE }}
          EBS_JSON_BASE_URL: ${{ secrets.EBS_JSON_BASE_URL_STAGE }}
          EBS_JSON_BASE_URL_STAGE: ${{ secrets.EBS_JSON_BASE_URL_STAGE }}
          EBS_JSON_API_KEY: ${{ secrets.EBS_JSON_API_KEY_STAGE }}
          EBS_JSON_API_KEY_STAGE: ${{ secrets.EBS_JSON_API_KEY_STAGE }}
          EDGE_COMMERCE_API_BASE: ${{ secrets.EDGE_COMMERCE_API_BASE_STAGE }}
          EDGE_COMMERCE_API_BASE_STAGE: ${{ secrets.EDGE_COMMERCE_API_BASE_STAGE }}
          # meta-capi — action picks the pixel by runtime namespace (prod/stage/uat),
          # so all three pixel ids must be present regardless of deploy env.
          # META_BASE_URL / META_API_VERSION have in-code defaults and are omitted.
          META_PIXEL_ID: ${{ secrets.META_PIXEL_ID_STAGE }}
          META_PIXEL_ID_STAGE: ${{ secrets.META_PIXEL_ID_STAGE }}
          META_PIXEL_ID_UAT: ${{ secrets.META_PIXEL_ID_UAT }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN_STAGE }}
          # recipe-notify — RECIPE_NOTIFY_ENABLED intentionally NOT set on stage,
          # so the scheduled digest no-ops here (no duplicate emails).
          RECIPE_NOTIFY_TOKEN: ${{ secrets.RECIPE_NOTIFY_TOKEN_STAGE }}
          # managed inventory — INVENTORY_SYNC_ENABLED intentionally NOT set on
          # stage: there is one DA sheet and one (prod) catalog, so stage writes
          # nothing (ebs-sync queues nothing, inventory-sync's schedule no-ops).
          # EDGE_COMMERCE_API_CATALOG_TOKEN is also intentionally NOT passed: the
          # catalog only exists in prod, so a stage catalog write would hit prod.
          # Catalog GETs are public, so stage { dryRun: true } runs still work.
          # feeds-push — CJ test feed SFTP credentials; targets/files live in code
          CJ_SFTP_USERNAME: ${{ secrets.CJ_SFTP_USERNAME_STAGE }}
          CJ_SFTP_PASSWORD: ${{ secrets.CJ_SFTP_PASSWORD_STAGE }}
          ALERT_FEED_FAIL_EMAILS: ${{ secrets.ALERT_FEED_FAIL_EMAILS }}

        uses: adobe/aio-apps-action@3.3.0
        with:
          os: ubuntu-latest
          command: deploy
          noPublish: true

  post-deploy-test:
    name: Post-Deploy Tests
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 24.x
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install
      - name: Post-Deploy Tests
        run: npm run test-postdeploy
        env:
          AIO_RUNTIME_NAMESPACE: ${{ secrets.AIO_RUNTIME_NAMESPACE_STAGE }}
