name: Production

on:
  push:
    branches: [main]
  # Manual redeploy of `main` without cutting a release (e.g. after changing a
  # secret such as INVENTORY_SYNC_ENABLED_PROD). Pushes still release via
  # semantic-release; a manual run only runs `aio app deploy`.
  workflow_dispatch:

# Never run two prod deploys at once; a queued run waits for the current one.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  id-token: write
  contents: write
  issues: read
  pull-requests: write

jobs:
  test:
    name: Test
    # Manual runs may only deploy `main` to prod.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      # Manual runs wait for any in-flight deploy (concurrency) and check out the
      # SHA captured when the run was requested. If the branch moved meanwhile
      # (e.g. semantic-release committed a new version), that SHA is stale:
      # deploying it would overwrite the newer deployment. Fail instead.
      - name: Reject stale manual run
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$GITHUB_REF_NAME" --jq .object.sha)
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo "::error::$GITHUB_REF_NAME moved to $head after this run was requested ($GITHUB_SHA). Re-run the workflow to deploy the latest commit."
            exit 1
          fi
      - uses: actions/checkout@v4
      - name: Use Node.js 24.x
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install
      - run: npm test

  release:
    name: Release
    # Pinned to match deploy_stage.yml (see the note there). Not strictly needed
    # here — the deploy runs via semantic-release without sudo — but keeps both
    # deploy jobs on the same image.
    runs-on: ubuntu-24.04
    needs: test
    steps:
      - name: Generate release token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false
      - name: Use Node.js 24.x
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install
      - name: Setup CLI
        uses: adobe/aio-cli-setup-action@1.3.0
        with:
          os: ubuntu-latest
          version: 11.x.x
      - name: Auth
        uses: adobe/aio-apps-action@3.3.0
        with:
          os: ubuntu-latest
          command: oauth_sts
          CLIENTID: ${{ secrets.CLIENTID_PROD }}
          CLIENTSECRET: ${{ secrets.CLIENTSECRET_PROD }}
          TECHNICALACCOUNTID: ${{ secrets.TECHNICALACCID_PROD }}
          TECHNICALACCOUNTEMAIL: ${{ secrets.TECHNICALACCEMAIL_PROD }}
          IMSORGID: ${{ secrets.IMSORGID_PROD }}
          SCOPES: ${{ secrets.SCOPES_PROD }}
      # push: semantic-release (version, changelog, GitHub release; its publishCmd
      # runs `aio app deploy`). Manual run: `aio app deploy` only, same env.
      - name: Release and deploy
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            aio app deploy
          else
            npm run semantic-release
          fi
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          AIO_RUNTIME_NAMESPACE: ${{ secrets.AIO_RUNTIME_NAMESPACE_PROD }}
          AIO_RUNTIME_AUTH: ${{ secrets.AIO_RUNTIME_AUTH_PROD }}
          AIO_PROJECT_ID: ${{ secrets.AIO_PROJECT_ID_PROD }}
          AIO_PROJECT_NAME: ${{ secrets.AIO_PROJECT_NAME_PROD }}
          AIO_PROJECT_ORG_ID: ${{ secrets.AIO_PROJECT_ORG_ID_PROD }}
          AIO_PROJECT_WORKSPACE_ID: ${{ secrets.AIO_PROJECT_WORKSPACE_ID_PROD }}
          AIO_PROJECT_WORKSPACE_NAME: ${{ secrets.AIO_PROJECT_WORKSPACE_NAME_PROD }}
          AIO_PROJECT_WORKSPACE_DETAILS_SERVICES: ${{ secrets.AIO_PROJECT_WORKSPACE_DETAILS_SERVICES_PROD }}
          AIO_CLIENTID: ${{ secrets.CLIENTID_PROD }}
          AIO_CLIENTSECRET: ${{ secrets.CLIENTSECRET_PROD }}
          AIO_SCOPES: ${{ secrets.SCOPES_PROD }}
          AIO_IMSORGID: ${{ secrets.IMSORGID_PROD }}
          AIO_EVENTS_PROVIDER_ID: ${{ secrets.EVENTS_PROVIDER_ID_PROD }}
          EMAIL_TOKEN: ${{ secrets.EMAIL_TOKEN_PROD }}
          PROXY_TOKEN: ${{ secrets.PROXY_TOKEN }}
          EBS_BASE_URL: ${{ secrets.EBS_BASE_URL_PROD }}
          EBS_BASE_URL_STAGE: ${{ secrets.EBS_BASE_URL_STAGE }}
          EBS_API_KEY: ${{ secrets.EBS_API_KEY_PROD }}
          EBS_API_KEY_STAGE: ${{ secrets.EBS_API_KEY_STAGE }}
          SYNC_STATUS_TOKEN: ${{ secrets.SYNC_STATUS_TOKEN_PROD }}
          EDGE_COMMERCE_API_ORDERS_TOKEN: ${{ secrets.EDGE_COMMERCE_API_ORDERS_TOKEN_PROD }}
          EBS_JSON_BASE_URL: ${{ secrets.EBS_JSON_BASE_URL_PROD }}
          EBS_JSON_BASE_URL_STAGE: ${{ secrets.EBS_JSON_BASE_URL_STAGE }}
          EBS_JSON_API_KEY: ${{ secrets.EBS_JSON_API_KEY_PROD }}
          EBS_JSON_API_KEY_STAGE: ${{ secrets.EBS_JSON_API_KEY_STAGE }}
          EDGE_COMMERCE_API_BASE: ${{ secrets.EDGE_COMMERCE_API_BASE_PROD }}
          EDGE_COMMERCE_API_BASE_STAGE: ${{ secrets.EDGE_COMMERCE_API_BASE_STAGE }}
          # meta-capi — action picks the pixel by runtime namespace (prod/stage/uat),
          # so all three pixel ids must be present regardless of deploy env.
          # META_BASE_URL / META_API_VERSION have in-code defaults and are omitted.
          META_PIXEL_ID: ${{ secrets.META_PIXEL_ID_PROD }}
          META_PIXEL_ID_STAGE: ${{ secrets.META_PIXEL_ID_STAGE }}
          META_PIXEL_ID_UAT: ${{ secrets.META_PIXEL_ID_UAT }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN_PROD }}
          # recipe-notify — PROD is the only environment that sends the digest
          RECIPE_NOTIFY_ENABLED: "true"
          RECIPE_NOTIFY_TOKEN: ${{ secrets.RECIPE_NOTIFY_TOKEN_PROD }}
          # managed inventory (ebs-sync outbox + inventory-sync). Enabled only when
          # the INVENTORY_SYNC_ENABLED_PROD secret is "true"; unset = disabled, so
          # rollout is a secret toggle + redeploy rather than a code change.
          INVENTORY_SYNC_ENABLED: ${{ secrets.INVENTORY_SYNC_ENABLED_PROD }}
          EDGE_COMMERCE_API_CATALOG_TOKEN: ${{ secrets.EDGE_COMMERCE_API_CATALOG_TOKEN_PROD }}
          # feeds-push — off in prod (src/actions/feeds-push/config.js). Add
          # CJ_SFTP_USERNAME/PASSWORD from *_PROD secrets when prod is enabled.
          ALERT_FEED_FAIL_EMAILS: ${{ secrets.ALERT_FEED_FAIL_EMAILS }}
